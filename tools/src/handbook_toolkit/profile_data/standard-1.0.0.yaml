# Standard handbook profile, version 1.0.0.
# Approved by the owner on 2026-11-06; 1.0.0 preserves the approved 0.2.0 rules and adds
# an explicit automated/assisted/manual classification for every rule. The profile is the default for new books; alternative
# profiles and explicit, owner-approved exceptions remain allowed.
# The machine-readable schema ships with the toolkit at
# tools/src/handbook_toolkit/schemas/profile.schema.json.
schema_version: "1.0"
id: standard
version: "1.0.0"
status: approved
title: Standard handbook profile
description: >-
  Reader-first handbook structure derived from the existing Solutions Architecture Handbook:
  every chapter explains when to use it and what to remember, every section ends with a concrete
  example, a pitfall and a real trade-off, and every unit answers definition, purpose, scope and
  need. The review checklist is topic-neutral. Figures and tables are expected only when they
  improve understanding; they are not mandatory. Profiles and exceptions are explicit and
  versioned.

provenance:
  derived_from: "solutions-architecture-handbook@6a15cc211f65e148afdaa75c71a063a8084d1910 (read-only inspection)"
  references:
    - "sdd/specs/rc3/STYLE.md"
    - "sdd/specs/phase-3/PLAN.md"
    - "docs/project/MASTER_PROMPT.md"
    - "AGENTS.md"
    - "DECISIONS.md"

chapter:
  required_elements:
    - id: when-to-use
      title: When to Use This Chapter
      kind: callout
      placement: before-first-section
      required: true
    - id: key-takeaway
      title: Key Takeaway
      kind: callout
      placement: before-first-section
      required: true
    - id: worked-example
      title: Worked Example
      kind: section
      placement: last-section
      required: true
    - id: review-checklist
      title: Review Checklist
      kind: checklist-callout
      placement: end-of-worked-example
      required: true
    - id: further-reading
      title: Further Reading
      kind: numbered-section
      placement: last-numbered-section
      required: true

section:
  # Diagrams and tables are optional: use them only when they improve the explanation.
  required_elements:
    - id: example
      title: Example
      kind: paragraph
      placement: section-closing
      required: true
    - id: common-pitfall
      title: Common Pitfall
      kind: callout
      placement: section-closing
      required: true
    - id: decision-trade-off
      title: Decision & Trade-off
      kind: callout
      placement: section-closing
      required: true
  forbid_single_unit: true
  closing_order:
    - example
    - common-pitfall
    - decision-trade-off

unit:
  required_labels:
    - "Definition."
    - "Purpose."
    - "What it includes."
    - "Why it is needed."
  label_style: bold-period
  min_words: 150
  max_words: 350

figure:
  required: false
  min_per_section: 0
  source_format: dot
  alt_text_required: true
  max_natural_width_px: 2000
  min_effective_font_pt: 10
  preserve_aspect_ratio: true
  upscale: false

table:
  required: false
  min_per_section: 0
  caption_position: below
  caption_prefix: ": "
  number_in_decision_callout: false
  adaptive_widths: true

cross_references:
  style: explicit
  automatic_glossary_links: false

licensing:
  content: CC-BY-SA-4.0
  code: MIT
  notice_required: true
  third_party_review: required

exceptions:
  allowed: true
  requires_owner_approval: true
  record_location: "sdd/changes/<id>/profile-exceptions.md"


# Explicit enforcement classification for every profile rule. This does not change the approved
# 0.2.0 editorial rules; it records which checks are deterministic, which the tool assists, and
# which remain human review.
validation:
  rules:
    - id: chapter-skeleton
      description: Required chapter callouts, worked example, review checklist and Further Reading placement.
      classification: automated
    - id: section-closing
      description: Example, Common Pitfall and Decision & Trade-off presence, order and actual forms.
      classification: automated
    - id: unit-labels
      description: Definition/Purpose/What it includes/Why it is needed labels and ordering.
      classification: automated
    - id: heading-meaningful
      description: Section and unit headings carry a real title rather than a placeholder.
      classification: assisted
    - id: figure-presence
      description: Figures are optional; when present they have a caption, source and alt text.
      classification: assisted
    - id: figure-readability
      description: Proportional sizing, no upscaling and at least 10 pt effective print text.
      classification: manual
    - id: table-caption
      description: Captioned tables use Table N.T — Title below the table outside the decision callout.
      classification: automated
    - id: table-widths
      description: Column widths adapt to visible content and remain readable after rendering.
      classification: manual
    - id: cross-references
      description: Explicit @sec/@fig/@tbl labels and local image paths resolve across the reading order.
      classification: automated
    - id: glossary-links
      description: Automatic glossary-term linking stays off; navigation links are deliberate.
      classification: manual
    - id: appendix-shape
      description: Appendices are validated with chapters in chapter mode.
      classification: automated
    - id: pilot-prerelease
      description: Section-pilot and preview builds require a prerelease book version.
      classification: automated
    - id: publication-identity
      description: Manifest/checksum identity, payload inspection and atomic final output.
      classification: automated
    - id: licensing
      description: Content/code licenses, notices, attribution and third-party rights review.
      classification: manual
    - id: exceptions
      description: Required omissions are explicit, reasoned and owner-approved.
      classification: manual

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handbook-toolkit"
version = "0.10.0"
description = "Shared deterministic validators for the handbook platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT for code; bundled schemas, profiles, fonts and render data keep the licenses in NOTICE.md" }
dependencies = [
  "jsonschema>=4.10,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
handbook-toolkit = "handbook_toolkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handbook_toolkit = ["schemas/*.json", "design/*.json", "profile_data/*.yaml", "render_data/filters/*.lua", "render_data/typst/*.typ", "render_data/docx/*.docx", "render_data/html/*.css", "render_data/fonts/*/*.ttf", "render_data/fonts/*/*.woff2", "render_data/fonts/*/*.txt"]

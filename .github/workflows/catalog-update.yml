name: catalog-update

# Manual only: a cross-repository release event would need a stored personal access token.
# See docs/catalog-automation.md. This workflow never pushes to main and never opens a pull request.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slug of a book already listed in the catalog
        type: string
        required: true
      tag:
        description: Published stable release tag (vMAJOR.MINOR.PATCH)
        type: string
        required: true
      dry_run:
        description: Validate and verify only; push nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    env:
      SLUG: ${{ inputs.slug }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Refuse a real run outside main
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real run must be dispatched from main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install the toolkit
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate the request and resolve the source repository
        id: request
        run: |
          source_repo="$(python3 tools/scripts/update_catalog.py source-repo --catalog catalog/catalog.json --slug "$SLUG" --tag "$TAG")"
          echo "source_repo=$source_repo" >> "$GITHUB_OUTPUT"
      - name: Fetch the published release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ steps.request.outputs.source_repo }}
        run: gh api "repos/$SOURCE_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
      - name: Update the catalog
        id: update
        env:
          SOURCE_REPO: ${{ steps.request.outputs.source_repo }}
        run: |
          result="$(python3 tools/scripts/update_catalog.py apply --catalog catalog/catalog.json --slug "$SLUG" --tag "$TAG" \
            --source-repo "$SOURCE_REPO" --release-json "$RUNNER_TEMP/release.json")"
          echo "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- catalog/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the published bytes of every listed release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m handbook_toolkit.catalog_verification catalog/catalog.json
      - name: Run the full repository checks
        run: make full
      - name: Keep the verified catalog for the publish job
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-update
          path: catalog/catalog.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize a run that pushes nothing
        if: inputs.dry_run || steps.update.outputs.changed != 'true'
        run: |
          {
            echo ""
            echo "Verification passed. Nothing was pushed (dry run: $DRY_RUN)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: prepare
    if: ${{ !inputs.dry_run && needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the catalog/* branch
      actions: write # dispatch ci.yml on that branch
    env:
      SLUG: ${{ inputs.slug }}
      TAG: ${{ inputs.tag }}
      BRANCH: catalog/${{ inputs.slug }}-${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-update
          path: ${{ runner.temp }}/catalog-update
      - name: Push the catalog branch
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists. Finish or delete it before running again."
            exit 1
          fi
          cp "$RUNNER_TEMP/catalog-update/catalog.json" catalog/catalog.json
          test "$(git status --porcelain)" = " M catalog/catalog.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add catalog/catalog.json
          git commit -m "feat(catalog): list $SLUG release $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Trigger the required checks on the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Tell the owner how to open the pull request
        run: |
          compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          {
            echo "Pushed \`$BRANCH\` and triggered \`ci.yml\` on it."
            echo ""
            echo "Open the pull request: $compare_url"
            echo ""
            echo "Remaining human steps: independent review of the links and release evidence, then owner merge."
          } >> "$GITHUB_STEP_SUMMARY"

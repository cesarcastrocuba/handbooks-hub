name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolkit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Fast checks
        run: make check
      - name: Full checks
        run: make full

  quickstart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the documented in-repo venv and install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
      - name: Run the documented make checks
        run: |
          . .venv/bin/activate
          make check
          make full
      - name: Run the documented no-make checks
        run: |
          . .venv/bin/activate
          PYTHONPATH=tools/src python3 -m unittest discover -s tools/tests -v
          PYTHONPATH=tools/src python3 -m handbook_toolkit --root . verify
          PYTHONPATH=tools/src python3 -m handbook_toolkit --root . verify --full

  template-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned toolkit in an independent book copy
        run: |
          book="$RUNNER_TEMP/book-template"
          cp -a template/book "$book"
          mkdir -p "$book/schemas"
          printf '%s\n' '{"type": "object", "required": ["decoy-must-never-be-used"]}' \
            > "$book/schemas/book.schema.json"
          cd "$book"
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          handbook-toolkit --root . validate-book --full
          handbook-toolkit --root . validate-references book.yaml
          handbook-toolkit --root . validate-manuscript manuscript/chapters/01-example.qmd \
            --mode chapter --profile "$GITHUB_WORKSPACE/profiles/standard/profile.yaml"
          test "$(handbook-toolkit version)" = "handbook-toolkit 0.5.0"

  publication-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"
      - name: Install PDF inspection dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install the toolkit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build a real pilot and verify the six-file identity
        run: python3 -m unittest discover -s tools/tests -p test_build.py -v
      - name: Run render-resource runtime tests
        run: python3 -m unittest discover -s tools/tests -p test_render_resources.py -v
      - name: Copy and build the template in a temporary repository
        run: python3 -m unittest discover -s tools/tests -p test_template.py -v

  wheel-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the toolkit wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheelhouse" tools
      - name: Verify the wheel contains the packaged schemas
        run: |
          python - "$RUNNER_TEMP" <<'PY'
          import glob
          import os
          import sys
          import zipfile

          wheels = glob.glob(os.path.join(sys.argv[1], "wheelhouse", "*.whl"))
          assert len(wheels) == 1, wheels
          required = {
              "handbook_toolkit/schemas/book.schema.json",
              "handbook_toolkit/schemas/catalog.schema.json",
              "handbook_toolkit/schemas/profile.schema.json",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          assert not missing, f"wheel is missing packaged schemas: {missing}"
          print(f"wheel contains {len(required)} schemas")
          PY
      - name: Install the wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/toolkit-venv"
          "$RUNNER_TEMP/toolkit-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/toolkit-venv/bin/python" -m pip install "$RUNNER_TEMP"/wheelhouse/*.whl
          "$RUNNER_TEMP/toolkit-venv/bin/python" - <<'PY'
          import pathlib
          import handbook_toolkit

          path = pathlib.Path(handbook_toolkit.__file__).resolve()
          print(path)
          assert "site-packages" in str(path), path
          from handbook_toolkit.profile_resources import load_profile
          current = load_profile("standard", "1.0.0")
          previous = load_profile("standard", "0.2.0")
          assert current["status"] == "approved", current
          assert previous["status"] == "approved", previous
          PY
      - name: Validate an independent book outside the checkout
        run: |
          book="$RUNNER_TEMP/independent-book"
          cp -a template/book "$book"
          mkdir -p "$book/schemas"
          for schema in book catalog profile; do
            printf '%s\n' '{"type": "object", "required": ["decoy-must-never-be-used"]}' \
              > "$book/schemas/$schema.schema.json"
          done
          cd "$book"
          "$RUNNER_TEMP/toolkit-venv/bin/handbook-toolkit" --root . validate-book --full

# The wheel-install job checks the installed-package boundary; it is not a publication or release
# step.

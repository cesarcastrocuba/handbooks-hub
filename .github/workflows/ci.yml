name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolkit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Fast checks
        run: make check
      - name: Full checks
        run: make full

# The artifact build and portal checks are added in Phase 4. Until then, "full" means every check the
# hub currently owns; it is not a substitute for the future publication gate.

name: portal-pages

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated catalog to Pages (main only)
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "catalog/**"

permissions:
  contents: read

concurrency:
  group: portal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.11.9"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install and verify the toolkit
        run: |
          python -m pip install -r requirements-dev.txt
          make full
      - name: Build the approved-release catalog
        env:
          # Authenticates the read-only GitHub API calls of the release verification, which
          # otherwise share the anonymous rate limit of the runner's address.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m handbook_toolkit.catalog_verification catalog/catalog.json
          # Page-weight parity has not passed; only the unchanged legacy site is deployed.
          python -m handbook_toolkit.portal catalog/catalog.json --output _site
          python -m handbook_toolkit.portal catalog/catalog.json --output _quarto_candidate --engine quarto
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the exact generated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified site artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

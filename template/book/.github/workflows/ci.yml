name: ci

# Fast checks on every branch and pull request. The book's own `make check` is the gate;
# artifact builds run in the release workflow.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fast checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pinned toolkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the fast checks
        run: make check

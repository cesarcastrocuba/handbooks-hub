project:
  type: book
  output-dir: _output

book:
  title: "Handbook Template"
  author: "Template Author"
  date: "2026-11-06"
  search: true
  repo-url: "https://github.com/OWNER/REPOSITORY"
  repo-actions: [issue]
  navbar:
    right:
      - text: "Handbook Hub"
        href: "https://cesarcastrocuba.github.io/handbooks-hub/"
      - text: "Tables"
        href: "tables.html"
      - text: "Source"
        href: "https://github.com/OWNER/REPOSITORY/tree/main/manuscript"
      - text: "Downloads"
        href: "https://github.com/OWNER/REPOSITORY/releases"

format:
  html:
    toc: true
    toc-depth: 3
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
  typst:
    papersize: a4
    toc: true
    toc-depth: 3
  docx:
    toc: true
    toc-depth: 3

execute:
  enabled: false
